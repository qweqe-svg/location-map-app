<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>定位一下</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+4L8u7p+GxWvGogcQAeStqtwVdIu+DmnDEkPzrk7M="
    crossorigin=""
  />
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    #map {
      height: 400px;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    .buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: #4f46e5;
      color: white;
      border-radius: 0.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📍 定位一下</h1>
  <div id="map"></div>
  <div class="buttons" id="friend-buttons"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o2e0s4cLZRxpNtNnMEybQ3mSFCkAvh5ef/37VLs3vJ0="
    crossorigin=""
  ></script>
  <script>
    const map = L.map('map').setView([25.04, 121.56], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    // 假資料：朋友位置
    const friends = [
      { name: '阿明', lat: 25.0422, lng: 121.5353 },
      { name: '小芳', lat: 25.0385, lng: 121.5645 },
    ];

    // 在地圖上加朋友的 marker
    friends.forEach(friend => {
      const marker = L.marker([friend.lat, friend.lng]).addTo(map);
      marker.bindPopup(friend.name);
    });

    // 顯示使用者位置
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const userMarker = L.marker([lat, lng]).addTo(map);
        userMarker.bindPopup('你的位置').openPopup();
        map.setView([lat, lng], 15);
      });
    }

    // 建立快速跳轉朋友的按鈕
    const buttonContainer = document.getElementById('friend-buttons');
    friends.forEach(friend => {
      const btn = document.createElement('button');
      btn.textContent = `看 ${friend.name}`;
      btn.onclick = () => {
        map.setView([friend.lat, friend.lng], 15);
      };
      buttonContainer.appendChild(btn);
    });
  </script>
</body>
</html>
